<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 有些内嵌浏览器不认这些 meta，但响应头会补；HTML 被缓存就会出问题 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传资料 · tree2</title>
  <style>
    :root { --navy: #1e3a5f; --sub: #8a7f6e; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px;
           background: radial-gradient(900px 340px at 50% -10%, #fff6e0, rgba(255,246,224,0) 70%), #fffaf0; min-height: 100vh;
           font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1e3a5f; }
    main { max-width: 640px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e8dcc3; border-radius: 14px; padding: 24px; box-shadow: 0 8px 26px rgba(30,58,95,.06); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; text-decoration: none; color: #1e3a5f; margin: 0 0 6px; font-size: 15px; }
    .brand img { width: 22px; height: 22px; }
    h1 { font-size: 19px; margin: 0 0 18px; }
    label { display: block; font-size: 12.5px; color: #8a7f6e; margin: 14px 0 4px; }
    input[type="password"], input[type="text"], select {
      width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid #d9cdb5; border-radius: 9px;
      font: inherit; color: inherit; background: #fffdf6;
    }
    button { margin-top: 18px; width: 100%; padding: 12px 20px; border: 0; border-radius: 10px; cursor: pointer;
             background: #1e3a5f; color: #fff; font: 700 15px/1 inherit; font-family: inherit; }
    button:hover { background: #16314f; }
    .hint { color: #8a7f6e; font-size: 12.5px; margin: 10px 0 0; }
    ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
    li { border: 1px solid #ece1ca; border-radius: 10px; padding: 9px 12px; font-size: 13px; }
    li .n { font-weight: 600; word-break: break-all; }
    li[data-state="done"] { border-color: #bfe3cf; background: #f4fbf6; }
    li[data-state="error"] { border-color: #e3a1a1; background: #fff7f5; }
    li .bar { height: 5px; border-radius: 3px; background: #f0e8d8; margin-top: 6px; overflow: hidden; }
    li .bar i { display: block; height: 100%; width: 0; background: #f59e0b; transition: width .2s; }
    li[data-state="done"] .bar i { background: #2f9e63; }
    .foot { text-align: center; color: #b0a893; font-size: 12px; margin: 16px 0 0; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <a class="brand" href="/"><img src="assets/paw.svg" alt="">备考资料导航 <small>TREE2</small></a>
    <h1>上传资料给资料库</h1>

    <label for="token">上传口令（管理员发给你，本页保存在此浏览器）</label>
    <input type="password" id="token" autocomplete="off" placeholder="粘贴口令，回车确认">
    <p id="gate-hint" style="margin:10px 0 0;color:#8a7f6e;font-size:13px">🔒 输入口令后开始上传</p>

    <div id="gate" hidden>
      <label for="year">届别</label>
      <select id="year"></select>
      <div class="row" style="display:flex;gap:10px">
        <div style="flex:1;min-width:0">
          <label for="batch">上传到批次</label>
          <select id="batch"></select>
        </div>
        <div id="newwrap" style="flex:1;min-width:0;display:none">
          <label for="newbatch">新批次名</label>
          <input type="text" id="newbatch" placeholder="例如：B5厦门二检（2026.11）…" autocomplete="off">
        </div>
      </div>
      <button type="button" id="pick">选择文件（可多选；.zip 会自动解压上传）</button>
      <p class="hint" id="who">压缩包里的子文件夹会原样变成批次里的子目录；普通文件直接进批次根目录。整包只有一个与压缩包同名的外层文件夹时（右键压缩文件夹的产物），这层会自动去掉，不会多套一层。</p>
      <ul id="list"></ul>
    </div>
  </div>
  <p class="foot"><a href="/">福建高考备考资料导航 tree2</a></p>
</main>

<script src="vendor/jszip-3.10.2/jszip.min.js"></script>
<script src="vendor/sha256.umd.min.js"></script>
<script src="js/upload-file.js?v=1"></script>
<script>
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var PART = window.tree2Upload.partSize;
  var LS_TOKEN = 'tree2.ctoken';
  var STATE = { kind: null, batches: [], years: [] }; // batches: [{name, year}]

  function normToken(v) {
    return String(v || '')
      .replace(/[\uFF01-\uFF5E]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
      .replace(/\u3000/g, ' ')
      .trim();
  }
  function token() { return normToken($('token').value || localStorage.getItem(LS_TOKEN) || ''); }
  function log(msg) { console.log('[customer]', msg); }

  // ---- 口令门 ----
  function applyGate(ok, msg) {
    $('gate').hidden = !ok;
    var h = $('gate-hint');
    h.hidden = !!ok;
    if (!ok && msg) h.textContent = msg;
  }
  function verifyToken(v) {
    if (!v) { applyGate(false); return; }
    fetch('/api/tree2/ctoken-check?token=' + encodeURIComponent(v))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { applyGate(false, res.d.error || '口令无效'); return; }
        STATE.kind = res.d.kind;
        applyGate(true);
        if (res.d.kind === 'once') {
          STATE.batches = res.d.batchYear || [];
          $('who').textContent = '一次性口令：只能传到指定批次' +
            (res.d.remaining != null ? '，剩余可用 ' + res.d.remaining + ' 次' : '');
          $('newwrap').style.display = 'none';
          fillYears();
        } else {
          // daily：可新建批次，届别任选
          STATE.batches = [];
          $('who').textContent = '每日口令：可选择已有批次或新建批次（明天此口令会自动更换，届时找管理员拿新的）';
          $('newwrap').style.display = '';
          loadYears().then(function () { fillBatches(); });
        }
      })
      .catch(function () { applyGate(false, '网络异常，稍后重试'); });
  }

  function loadYears() {
    return fetch('/api/tree2/seasons').then(function (r) { return r.json(); }).then(function (d) {
      STATE.years = (d.seasons || []).map(function (s) { return s.id; });
      var y = $('year'); y.innerHTML = '';
      STATE.years.forEach(function (id) {
        var o = document.createElement('option'); o.value = id; o.textContent = id + ' 届'; y.appendChild(o);
      });
    });
  }
  function fillYears() {
    var years = [];
    STATE.batches.forEach(function (b) { if (years.indexOf(b.year) < 0) years.push(b.year); });
    years.sort();
    var y = $('year'); y.innerHTML = '';
    years.forEach(function (id) {
      var o = document.createElement('option'); o.value = id; o.textContent = id + ' 届'; y.appendChild(o);
    });
    fillBatches();
  }
  function fillBatches() {
    var b = $('batch'); b.innerHTML = '';
    if (STATE.kind === 'once') {
      STATE.batches.filter(function (x) { return x.year === $('year').value; }).forEach(function (x) {
        var o = document.createElement('option'); o.value = x.name; o.textContent = x.name; b.appendChild(o);
      });
    } else {
      fetch('/api/tree2/seasons/' + encodeURIComponent($('year').value)).then(function (r) { return r.json(); }).then(function (m) {
        (m.batches || []).forEach(function (x) {
          var o = document.createElement('option'); o.value = x.name; o.textContent = x.name; b.appendChild(o);
        });
      });
    }
  }
  $('year').addEventListener('change', fillBatches);

  function folder() {
    if (STATE.kind === 'daily' && $('newwrap').style.display !== 'none') {
      var nb = normToken($('newbatch').value);
      if (!nb) { alert('先填新批次的名字'); throw new Error('no batch'); }
      return nb;
    }
    return $('batch').value;
  }

  $('token').addEventListener('input', function () {
    var v = normToken(this.value);
    clearTimeout(verifyToken._t);
    verifyToken._t = setTimeout(function () {
      if (v) localStorage.setItem(LS_TOKEN, v); else localStorage.removeItem(LS_TOKEN);
      verifyToken(v);
    }, 500);
  });
  $('token').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var v = normToken(this.value);
    if (v) localStorage.setItem(LS_TOKEN, v);
    verifyToken(v);
  });

  // ---- 上传 ----
  function setRow(li, state, label, pct) {
    li.dataset.state = state;
    var n = li.querySelector('.n');
    // 文件名要一直看得见：原来 label 会整行覆盖掉名字，
    // 队列一卡就只剩一排「排队中…」，看不出是哪一个文件没动。
    if (n) n.textContent = label ? li.dataset.name + ' · ' + label : li.dataset.name;
    var bar = li.querySelector('.bar i');
    if (bar && pct != null) bar.style.width = Math.round(pct * 100) + '%';
  }
  function row(name, state, label) {
    var li = document.createElement('li');
    li.dataset.name = name;
    li.innerHTML = '<div class="n"></div><div class="bar"><i></i></div>';
    setRow(li, state, label);
    $('list').appendChild(li);
    return li;
  }

  function keyFor(sha, name) {
    var m = /\.([A-Za-z0-9]{1,8})$/.exec(name);
    return sha.slice(0, 2) + '/' + sha + (m ? '.' + m[1].toLowerCase() : '');
  }
  function putPart(target, key, i, n, blob) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', target.url + '/part?k=' + encodeURIComponent(key) + '&i=' + i + '&n=' + n + '&uploadId=' + target.uploadId);
      xhr.setRequestHeader('X-Tree2-Token', target.token);
      xhr.upload.onprogress = function (e) { if (e.lengthComputable) xhr._pct = e.loaded / e.total; };
      xhr.onload = function () { xhr.status === 200 ? resolve() : reject(new Error('分片失败：HTTP ' + xhr.status)); };
      xhr.onerror = function () { reject(new Error('网络中断')); };
      xhr.send(blob);
    });
  }

  async function uploadOne(job) {
    var li = row(job.name, 'run', '排队中…');
    try {
      var target = {
        url: '/api/tree2/files/' + encodeURIComponent(job.year),
        token: job.token,
        uploadId: window.tree2Upload.newId(),
      };
      var blob = await job.load();
      var sha = await window.tree2Upload.hashFile(blob);
      var key = keyFor(sha, job.name);
      async function commit(parts) {
        var res = await fetch(target.url + '/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Tree2-Token': target.token, 'X-Tree2': '1' },
          body: JSON.stringify({ key: key, sha256: sha, name: job.name, parts: parts, folder: job.folder, uploadId: target.uploadId }),
        });
        var data = await res.json();
        if (!res.ok) {
          if (!parts && data.code === 'quick_upload_failed') return false;
          throw new Error(data.error || ('HTTP ' + res.status));
        }
        if (!data.attached) throw new Error('内容已入库，但没有挂到清单，请向管理员确认目标目录');
        setRow(li, 'done', '已入库 → ' + job.folder + '/' + job.name, 1);
        return true;
      }

      var ext = (/\.[a-z0-9]{1,8}$/i.exec(job.name) || [''])[0].toLowerCase();
      var probe = await fetch(target.url + '?h=' + sha + '&ext=' + encodeURIComponent(ext))
        .then(function (res) { return res.json(); }).catch(function () { return null; });
      if (probe && probe.exists && probe.key === key) {
        setRow(li, 'run', '秒传：正在入库…', 1);
        if (await commit(0)) return;
      }
      var count = Math.max(1, Math.ceil(blob.size / PART));
      for (var i = 0; i < count; i++) {
        await putPart(target, key, i, count, blob.slice(i * PART, (i + 1) * PART));
        setRow(li, 'run', '上传分片 ' + (i + 1) + '/' + count, (i + 1) / count);
      }
      setRow(li, 'run', '合并校验…', 1);
      await commit(count);
    } catch (e) {
      setRow(li, 'error', '失败：' + (e && e.message ? e.message : e), 1);
    }
  }

  function readZipEntry(entry) {
    return new Promise(function (resolve, reject) {
      var chunks = [], size = 0;
      var stream = entry.internalStream('uint8array');
      stream.on('data', function (chunk) {
        size += chunk.byteLength;
        if (size > window.tree2Upload.maxSize) {
          stream.pause();
          chunks = [];
          reject(new Error('压缩包内文件超过 256 MiB'));
          return;
        }
        chunks.push(chunk);
      }).on('error', reject).on('end', function () { resolve(new Blob(chunks)); }).resume();
    });
  }

  // zip → 展开成普通任务（子目录进 folder）；跳过 mac 垃圾与目录项
  function expandZip(file, target) {
    var maxSize = window.tree2Upload.maxSize;
    if (file.size > maxSize) throw new Error('文件超过 256 MiB');
    if (!/\.zip$/i.test(file.name) || !window.JSZip) {
      return Promise.resolve([{ ...target, name: file.name, load: function () { return file; } }]);
    }
    return window.JSZip.loadAsync(file).then(function (zip) {
      var names = Object.keys(zip.files).filter(function (n) {
        return !zip.files[n].dir && !/(^|\/)(__MACOSX|\.DS_Store)/i.test(n);
      });
      if (!names.length) throw new Error('压缩包里没有文件');
      var inflated = names.reduce(function (sum, n) { return sum + zip.files[n]._data.uncompressedSize; }, 0);
      if (!Number.isSafeInteger(inflated) || inflated > maxSize) throw new Error('压缩包展开后超过 256 MiB');
      // 右键压缩整个文件夹得到的 zip：所有文件都在一个与压缩包同名的外层文件夹里，
      // 原样上传会变成 批次/文件夹名/文件，多出一层。这种同名外层自动剥掉；
      // 外层名与压缩包名不同时不剥（那是故意的子目录，比如 听力.zip）。
      var slash = function (n) { return n.replace(/\\/g, '/'); };
      var top = slash(names[0]).split('/')[0];
      var base = file.name.replace(/\.zip$/i, '');
      var wrapper =
        top &&
        names.every(function (n) { return slash(n).indexOf(top + '/') === 0; }) &&
        top.toLowerCase() === base.toLowerCase()
          ? top + '/'
          : '';
      var jobs = [];
      names.forEach(function (n) {
        var clean = slash(n).replace(/^\/+/, '');
        if (wrapper) clean = clean.slice(wrapper.length);
        if (clean.split('/').some(function (s) { return s === '..'; })) return; // 防路径穿越
        var dir = clean.split('/').slice(0, -1).join('/');
        var fname = clean.split('/').pop();
        if (!fname) return;
        var entry = zip.file(n);
        jobs.push({
          ...target,
          name: fname,
          folder: target.folder + (dir ? '/' + dir : ''),
          load: function () { return readZipEntry(entry); },
        });
      });
      return jobs;
    });
  }

  $('pick').addEventListener('click', function () {
    if (!token()) { alert('先填口令'); return; }
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.onchange = async function () {
      var target;
      try { target = { folder: folder(), year: $('year').value, token: token() }; }
      catch { return; }
      $('pick').disabled = true;
      try {
        for (var file of input.files) {
          try {
            var jobs = await expandZip(file, target);
            for (var job of jobs) await uploadOne(job);
          } catch (e) {
            row(file.name, 'error', '读取失败：' + (e && e.message ? e.message : e));
          }
        }
        log('全部完成');
      } finally {
        $('pick').disabled = false;
      }
    };
    input.click();
  });

  var qt = new URLSearchParams(location.search).get('token'); // 管理员复制的链接自带口令
  if (qt) { $('token').value = normToken(qt); localStorage.setItem(LS_TOKEN, normToken(qt)); }
  verifyToken(token()); // 打开页面先验一次（记住的口令直接解锁）
</script>
</body>
</html>
