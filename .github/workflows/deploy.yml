name: Deploy treenext

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treenext-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 单文件 Node 服务 + 静态站点，没有构建产物；语法检查当作最小编译门
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: node --check scripts/tree2-files-server.mjs

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known hosts
        env:
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      # 运行数据（清单 public/tree2/data/、data/、storage/、preview-cache/、backups/）
      # 由 .deployignore 保护，rsync --delete 不会碰它们；仓库独有文件在此额外排除
      - name: Deploy to /srv/treenext
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rz --delete --delete-delay \
            --no-perms --no-owner --no-group --no-times --omit-dir-times \
            --exclude-from=.deployignore \
            --exclude='.git' --exclude='.github' \
            --exclude='.deployignore' --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='README.md' \
            -e "ssh -p ${SERVER_PORT}" \
            ./ \
            "${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}/"

      # SERVER_USER 需要有重启权限：root 直接可用；专用部署用户配 sudoers NOPASSWD
      - name: Restart service and verify
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "systemctl restart tree2 && sleep 1 && systemctl is-active tree2"
