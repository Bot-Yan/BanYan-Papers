name: Deploy treenext

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treenext-production
  cancel-in-progress: true

jobs:
  deploy:
    # 自托管 runner 就装在生产机上：拉取、测试、部署同机完成，不需要把服务器私钥放进 GitHub Secrets。
    # runner 以 actions-runner 用户运行，标签 treenext，sudo 只放行部署用到的命令。
    # 源码用服务器上预置的 /srv/treenext-src（公开仓库的 clone），每次只拉增量：
    # 生产机直连 GitHub 下载大文件很慢，整仓 clone 会卡住。
    # 推送配置 data/update-push.json 属于服务器运行数据，部署不改写。
    runs-on: [self-hosted, linux, treenext]
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Fetch source (pre-seeded clone)
        run: |
          set -euo pipefail
          cd /srv/treenext-src
          test -d .git
          # 生产机直连 GitHub 偶发断流（GnuTLS -110），fetch 带退避重试
          for i in 1 2 3 4 5; do
            if git fetch --prune origin '+refs/heads/main:refs/remotes/origin/main'; then break; fi
            if [ "$i" = 5 ]; then echo "git fetch 连续 5 次失败"; exit 1; fi
            sleep $((i * 5))
          done
          # 固定到本次触发的提交；workflow_dispatch 时 GITHUB_SHA 是默认分支 HEAD
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx

      # 单文件 Node 服务 + 静态站点，没有构建产物；语法检查当作最小编译门
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 固定版本：runner 的工具缓存里预置了同版本的 Node（_work/_tool），
          # 命中缓存即不出网下载（GitHub Releases 的归档走生产机直连要 20 分钟）
          node-version: 24.20.0

      - name: Syntax check
        run: cd /srv/treenext-src && node --check scripts/tree2-files-server.mjs

      - name: Test uploads and guest access
        run: cd /srv/treenext-src && node --test test/tree2-upload.test.mjs

      # 运行数据（清单 public/tree2/data/、data/、storage/、preview-cache/、backups/）
      # 由 .deployignore 保护，rsync --delete 不会碰它们；仓库独有文件在此额外排除。
      # /srv/treenext 归 root：runner 用户借受限 sudo 同步。
      - name: Deploy to /srv/treenext
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          cd /srv/treenext-src
          target="${DEPLOY_PATH:-/srv/treenext}"
          test "$target" = /srv/treenext
          sudo mkdir -p "$target"
          sudo rsync -rz --delete --delete-delay \
            --no-perms --no-owner --no-group --no-times --omit-dir-times \
            --exclude-from=.deployignore \
            --exclude='.git' --exclude='.github' \
            --exclude='.deployignore' --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='/test/' \
            ./ "$target/"

      - name: Restart service and verify
        run: |
          set -euo pipefail
          sudo systemctl restart tree2
          sleep 1
          sudo systemctl is-active tree2
          # 启动冒烟：进程活着还不够，服务要能应答自检接口
          curl -fsS -m 5 http://127.0.0.1:8787/api/tree2/health >/dev/null
