name: Deploy treenext

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treenext-production
  cancel-in-progress: true

jobs:
  deploy:
    # 自托管 runner 就装在生产机上：构建与部署同机完成，不再需要 SSH 密钥同步产物。
    # 需要在服务器上注册 runner，标签用 treenext（见 README「部署」）。
    runs-on: [self-hosted, linux, treenext]
    timeout-minutes: 20
    environment:
      name: production

    steps:
      # 不走 actions/checkout：生产机在中国大陆，直连 GitHub 拉整个仓库只有几十 B/s，
      # checkout 会卡死。服务器上预置了一份 clone（/srv/treenext-src，由 bundle 初始化），
      # 这里只做增量 fetch —— 每次通常只有几百 KB。
      - name: Fetch source (local mirror checkout)
        run: |
          set -euo pipefail
          src=/srv/treenext-src
          test -d "$src/.git"
          cd "$src"
          git fetch --prune origin '+refs/heads/main:refs/remotes/origin/main'
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx

      # 后面所有步骤都在预置仓库目录里跑
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        working-directory: /srv/treenext-src
        run: node --check scripts/tree2-files-server.mjs

      - name: Test uploads and guest access
        working-directory: /srv/treenext-src
        run: node --test test/tree2-upload.test.mjs

      # 运行数据（清单 public/tree2/data/、data/、storage/、preview-cache/、backups/）
      # 由 .deployignore 保护，rsync --delete 不会碰它们；仓库独有文件在此额外排除。
      # runner 以 runner 用户运行，/srv/treenext 归 root：用受限 sudo 同步
      # （sudoers 只放行 rsync/mkdir/mktemp/mv/chown/systemctl tree2）。
      - name: Deploy to /srv/treenext
        working-directory: /srv/treenext-src
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          target="${DEPLOY_PATH:-/srv/treenext}"
          test "$target" = /srv/treenext
          sudo mkdir -p "$target"
          sudo rsync -rz --delete --delete-delay \
            --no-owner --no-group --no-times --omit-dir-times \
            --exclude-from=.deployignore \
            --exclude='.git' --exclude='.github' \
            --exclude='.deployignore' --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='/test/' \
            ./ "$target/"

      - name: Configure library update notifications
        env:
          TREE2_UPDATE_TOKEN: ${{ secrets.TREE2_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TREE2_UPDATE_TOKEN" ]]; then exit 0; fi
          [[ "$TREE2_UPDATE_TOKEN" =~ ^[a-zA-Z0-9_-]{32,128}$ ]]
          service_user="$(systemctl show tree2 --property=User --value)"
          dir=/srv/treenext/data
          payload="$(printf '{"origin":"https://console.example.com","token":"%s"}\n' "$TREE2_UPDATE_TOKEN")"
          # 借 sudo 写临时文件再原子改名：runner 用户对 data/ 没有直接写权限
          printf '%s\n' "$payload" | sudo tee "$dir/.update-push.tmp" >/dev/null
          sudo chmod 600 "$dir/.update-push.tmp"
          if [[ -n "$service_user" && "$service_user" != root && "$service_user" != "$(id -un)" ]]; then
            sudo chown "$service_user" "$dir/.update-push.tmp" || true
          fi
          sudo mv -f -- "$dir/.update-push.tmp" "$dir/update-push.json"

      # runner 在服务器上用受限 sudo 重启，不再需要 SERVER_USER 的 SSH 权限
      - name: Restart service and verify
        run: |
          sudo systemctl restart tree2
          sleep 1
          sudo systemctl is-active tree2
